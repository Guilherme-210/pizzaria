services:
  postgres:
    image: postgres:17-alpine
    container_name: pizzaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pizzaria
      POSTGRES_USER: pizzaria
      POSTGRES_PASSWORD: pizzaria_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - pizzaria_postgres_data:/var/lib/postgresql/data

volumes:
  pizzaria_postgres_data:
